<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Smart Electricity System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-bolt"></i>
                </div>
                <h2>Create Account</h2>
                <p>Start tracking your electricity consumption</p>
            </div>

            <form id="signupForm" class="auth-form" enctype="multipart/form-data">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>Profile Picture</label>
                        <div class="profile-upload">
                            <div class="upload-preview" id="profilePreview">
                                <i class="fas fa-user"></i>
                            </div>
                            <input type="file" id="profile_picture" name="profile_picture" accept="image/*">
                            <label for="profile_picture" class="upload-btn">
                                <i class="fas fa-camera"></i> Choose Photo
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Full Name *</label>
                        <input type="text" name="full_name" required placeholder="Enter your full name">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email *</label>
                        <input type="email" name="email" required placeholder="your.email@example.com">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> Phone</label>
                        <input type="tel" name="phone" placeholder="+91 1234567890">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Password *</label>
                        <input type="password" name="password" required placeholder="Enter password">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-home"></i> House Type</label>
                        <select name="house_type">
                            <option value="">Select type</option>
                            <option value="Apartment">Hostel</option>
                            <option value="Independent House">Independent House</option>
                            <option value="Villa">Industry/Factories</option>
                            <option value="Farmhouse">School/College</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-city"></i> City</label>
                        <input type="text" name="city" placeholder="Your city">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-map-marked-alt"></i> State *</label>
                        <select name="state" required>
                            <option value="">Select state</option>
                            <option value="Andhra Pradesh">Andhra Pradesh</option>
                            <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                            <option value="Assam">Assam</option>
                            <option value="Bihar">Bihar</option>
                            <option value="Chhattisgarh">Chhattisgarh</option>
                            <option value="Goa">Goa</option>
                            <option value="Gujarat">Gujarat</option>
                            <option value="Haryana">Haryana</option>
                            <option value="Himachal Pradesh">Himachal Pradesh</option>
                            <option value="Jharkhand">Jharkhand</option>
                            <option value="Karnataka">Karnataka</option>
                            <option value="Kerala">Kerala</option>
                            <option value="Madhya Pradesh">Madhya Pradesh</option>
                            <option value="Maharashtra">Maharashtra</option>
                            <option value="Manipur">Manipur</option>
                            <option value="Meghalaya">Meghalaya</option>
                            <option value="Mizoram">Mizoram</option>
                            <option value="Nagaland">Nagaland</option>
                            <option value="Odisha">Odisha</option>
                            <option value="Punjab">Punjab</option>
                            <option value="Rajasthan">Rajasthan</option>
                            <option value="Sikkim">Sikkim</option>
                            <option value="Tamil Nadu">Tamil Nadu</option>
                            <option value="Telangana">Telangana</option>
                            <option value="Tripura">Tripura</option>
                            <option value="Uttar Pradesh">Uttar Pradesh</option>
                            <option value="Uttarakhand">Uttarakhand</option>
                            <option value="West Bengal">West Bengal</option>
                            <option value="Delhi">Delhi</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-building"></i> Electricity Board</label>
                        <input type="text" name="electricity_board" placeholder="e.g., MSEB, BESCOM">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-tachometer-alt"></i> Meter Number</label>
                        <input type="text" name="meter_number" placeholder="Your meter number">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-plug"></i> Connection Type</label>
                        <select name="connection_type">
                            <option value="">Select type</option>
                            <option value="Single Phase">Single Phase</option>
                            <option value="Three Phase">Three Phase</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-rupee-sign"></i> Monthly Budget (₹)</label>
                        <input type="number" name="monthly_budget" value="1000" min="100" step="100" placeholder="1000">
                    </div>
                </div>

                <button type="submit" class="btn-primary btn-block" id="submitBtn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
            </div>
        </div>
    </div>

    <script>
        // Profile picture preview
        document.getElementById('profile_picture').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('profilePreview').innerHTML = 
                        `<img src="${e.target.result}" alt="Profile">`;
                };
                reader.readAsDataURL(file);
            }
        });

        // Form submission
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';
            
            const formData = new FormData(this);
            
            try {
                const response = await fetch('/signup', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('Account created successfully! Please login.');
                    window.location.href = '/login';
                } else {
                    alert(data.message || 'Registration failed. Please try again.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
                }
            } catch (error) {
                alert('An error occurred. Please try again.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            }
        });
    </script>
</body>
</html>
